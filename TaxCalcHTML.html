<!-- TaxCalc.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <link href="TaxCalcCSS.css" rel="stylesheet">
    <meta charset="utf-8">
    <title>Tax Calculator</title>
</head>
<body>
    <main>
    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/88/Flag_of_Ontario.svg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="Ontario Flag" width="25%" height="auto">
        <h1>Ontario Tax Calculator</h1>
    </header>
    <section id="user-input">
        <form>
            <label for="income">Annual Income:</label>
            <input type="number" id="income" name="income" required>
            <!-- decide whether or not we want the two options later-->
            <label for="deductions">Deductions:</label>
            <input type="number" id="deductions" name="deductions">
        </form>
    </section>
    <section id="tax-results">
        <h2>Tax Results</h2>
        <p>Federal Tax: <span id="federal-tax"> <placeholder></placeholder></span></p>
        <p>Provincial Tax: <span id="provincial-tax"><placeholder></placeholder></span></p>
        <p>Total Tax: <span id="total-tax"> <placeholder></placeholder></span></p>
    </section>
    </main>
</body>
</html>
